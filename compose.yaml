services:
  rag-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag-agent

    env_file:
      - .env

    ports:
      - "127.0.0.1:8501:8501"

    volumes:
      - rag_chroma:/app/chroma_db
      - rag_logs:/app/logs

    restart: unless-stopped

volumes:
  rag_chroma:
  rag_logs: